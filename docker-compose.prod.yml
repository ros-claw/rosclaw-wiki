version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: rosclaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  seekdb:
    image: oceanbase/seekdb:latest
    container_name: rosclaw-seekdb
    ports:
      - "2881:2881"
    volumes:
      - seekdb_data:/var/lib/seekdb
    environment:
      - SEEKDB_MODE=server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',2881), timeout=5); s.close()\""]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 60s

  rosclaw-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: rosclaw-api
    ports:
      - "8000:8000"
    environment:
      - WIKI_ROOT=/app/wiki
      - WIKI_BACKEND=seekdb
      - SEEKDB_MODE=server
      - SEEKDB_HOST=seekdb
      - SEEKDB_PORT=2881
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
    volumes:
      - ./wiki:/app/wiki
      - ./data:/app/data
    depends_on:
      seekdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # NOTE: Host-level nginx already handles reverse proxy + SSL on ports 80/443.
  # The rosclaw-api service exposes 8000 on the host loopback below.
  # To use Docker nginx instead, uncomment the block below and stop host nginx.
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: rosclaw-nginx
  #   ports:
  #     - "127.0.0.1:8080:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - rosclaw-api
  #   restart: unless-stopped

volumes:
  redis_data:
  seekdb_data:
