<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROSClaw Wiki — Knowledge Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }
    #app { display: flex; height: 100vh; flex-direction: column; }

    /* Top bar */
    #topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #1e293b; border-bottom: 1px solid #334155; }
    #topbar .left { display: flex; align-items: center; gap: 12px; }
    #topbar .logo { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    #topbar .status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #94a3b8; }
    #topbar .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    #topbar .status-dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    #topbar .status-dot.warn { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
    #topbar .status-dot.err { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    #topbar .apikey-wrap { display: flex; align-items: center; gap: 8px; }
    #topbar .apikey-wrap input { width: 260px; padding: 5px 10px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.8rem; font-family: monospace; }
    #topbar .apikey-wrap button { padding: 5px 12px; border-radius: 4px; border: none; background: #38bdf8; color: #0f172a; font-size: 0.8rem; cursor: pointer; }
    #topbar .apikey-wrap button:hover { background: #7dd3fc; }
    #topbar .stats-bar { display: flex; gap: 16px; font-size: 0.75rem; color: #94a3b8; }
    #topbar .stats-bar span { color: #e2e8f0; font-weight: 600; }

    /* Main */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 360px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow-y: auto; }
    .section { padding: 14px 16px; border-bottom: 1px solid #334155; }
    .section h3 { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Search */
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.9rem; }
    .search-row select { padding: 8px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.85rem; }
    .search-row button { padding: 8px 16px; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    .search-row button:hover { background: #7dd3fc; }
    .search-results { max-height: 260px; overflow-y: auto; margin-top: 10px; }
    .search-result { padding: 10px 12px; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.15s; border-radius: 4px; }
    .search-result:hover { background: #334155; }
    .search-result .title { font-weight: 600; font-size: 0.88rem; color: #38bdf8; }
    .search-result .snippet { font-size: 0.78rem; color: #94a3b8; margin-top: 3px; line-height: 1.4; }
    .search-result .score { font-size: 0.7rem; color: #64748b; margin-top: 3px; }

    /* Stats cards */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; text-align: center; }
    .stat-card .num { font-size: 1.3rem; font-weight: 700; color: #38bdf8; }
    .stat-card .num.zero { color: #64748b; }
    .stat-card .num.warn { color: #f59e0b; }
    .stat-card .label { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }

    /* Filters */
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid #475569; background: transparent; color: #cbd5e1; font-size: 0.78rem; cursor: pointer; }
    .filter-btn.active { background: #334155; border-color: #38bdf8; }
    .filter-btn.entity { border-color: #3b82f6; color: #3b82f6; }
    .filter-btn.entity.active { background: rgba(59,130,246,0.15); }
    .filter-btn.algorithm { border-color: #22c55e; color: #22c55e; }
    .filter-btn.algorithm.active { background: rgba(34,197,94,0.15); }
    .filter-btn.concept { border-color: #f59e0b; color: #f59e0b; }
    .filter-btn.concept.active { background: rgba(245,158,11,0.15); }
    .filter-btn.skill { border-color: #ec4899; color: #ec4899; }
    .filter-btn.skill.active { background: rgba(236,72,153,0.15); }

    /* Graph area */
    #graph-container { flex: 1; position: relative; background: #0f172a; }
    #sigma { width: 100%; height: 100%; }

    /* Tooltip */
    #tooltip { position: absolute; pointer-events: none; background: rgba(30, 41, 59, 0.95); border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; z-index: 100; display: none; max-width: 280px; }
    #tooltip .title { font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    #tooltip .type { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    #tooltip .pages { font-size: 0.75rem; margin-top: 4px; color: #cbd5e1; }

    /* Loading */
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1rem; color: #94a3b8; }

    /* Error toast */
    #toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; background: #ef4444; color: #fff; font-size: 0.85rem; z-index: 200; display: none; }
    #toast.info { background: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="left">
        <div class="logo">ROSClaw Wiki</div>
        <div class="status">
          <div class="status-dot warn" id="status-dot"></div>
          <span id="status-text">连接中...</span>
        </div>
      </div>
      <div class="stats-bar" id="stats-bar">
        <div>Pages: <span id="h-pages">-</span></div>
        <div>Links: <span id="h-links">-</span></div>
        <div>Judgments: <span id="h-judg">-</span></div>
        <div>Code Nodes: <span id="h-cgnodes">-</span></div>
      </div>
      <div class="apikey-wrap">
        <input type="password" id="api-key" placeholder="API Key: rw_..." />
        <button onclick="saveKey()">保存</button>
      </div>
    </div>

    <div id="main">
      <div id="sidebar">
        <div class="section">
          <div class="search-row">
            <input type="text" id="search-input" placeholder="搜索知识库..." onkeydown="if(event.key==='Enter')doSearch()" />
            <select id="search-type">
              <option value="hybrid">混合</option>
              <option value="semantic">语义</option>
              <option value="keyword">关键词</option>
              <option value="expanded">扩展</option>
              <option value="judgment">判据</option>
            </select>
            <button onclick="doSearch()">搜索</button>
          </div>
          <div class="search-results" id="search-results"></div>
        </div>

        <div class="section">
          <h3>知识库概览</h3>
          <div class="stat-grid">
            <div class="stat-card"><div class="num" id="s-pages">-</div><div class="label">Wiki 页面</div></div>
            <div class="stat-card"><div class="num" id="s-links">-</div><div class="label">交叉链接</div></div>
            <div class="stat-card"><div class="num" id="s-judg">-</div><div class="label">物理判据</div></div>
            <div class="stat-card"><div class="num" id="s-robots">-</div><div class="label">机器人覆盖</div></div>
            <div class="stat-card"><div class="num" id="s-cgnodes">-</div><div class="label">代码图谱节点</div></div>
            <div class="stat-card"><div class="num" id="s-cgedges">-</div><div class="label">代码图谱边</div></div>
          </div>
        </div>

        <div class="section">
          <h3>节点过滤</h3>
          <div class="filter-row">
            <button class="filter-btn active" data-type="all" onclick="setFilter('all')">全部</button>
            <button class="filter-btn entity" data-type="entity" onclick="setFilter('entity')">实体</button>
            <button class="filter-btn algorithm" data-type="algorithm" onclick="setFilter('algorithm')">算法</button>
            <button class="filter-btn concept" data-type="concept" onclick="setFilter('concept')">概念</button>
            <button class="filter-btn skill" data-type="skill" onclick="setFilter('skill')">技能</button>
          </div>
        </div>
      </div>

      <div id="graph-container">
        <div id="loading">加载知识图谱...</div>
        <div id="sigma"></div>
        <div id="tooltip"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API_BASE = 'https://api.rosclaw.io';
    const TYPE_COLORS = {
      entity: '#3b82f6',
      algorithm: '#22c55e',
      concept: '#f59e0b',
      skill: '#ec4899',
      index: '#94a3b8',
      unknown: '#64748b',
    };

    let graph = new graphology.Graph({ multi: false, allowSelfLoops: false });
    let renderer = null;
    let activeFilter = 'all';
    let keywordsData = [];

    function getKey() {
      return localStorage.getItem('rosclaw_api_key') || document.getElementById('api-key').value.trim();
    }

    function saveKey() {
      const key = document.getElementById('api-key').value.trim();
      if (key) {
        localStorage.setItem('rosclaw_api_key', key);
        document.getElementById('api-key').value = '';
        showToast('API Key 已保存', 'info');
        loadHealth();
      }
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = type === 'info' ? 'info' : '';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function apiGet(path) {
      const key = getKey();
      const headers = { 'Content-Type': 'application/json' };
      if (key) headers['X-API-Key'] = key;
      const res = await fetch(API_BASE + path, { headers });
      if (res.status === 401) {
        showToast('API Key 无效或缺失，请在顶部输入');
        throw new Error('401');
      }
      return res.json();
    }

    async function apiPost(path, body) {
      const key = getKey();
      const headers = { 'Content-Type': 'application/json' };
      if (key) headers['X-API-Key'] = key;
      const res = await fetch(API_BASE + path, { method: 'POST', headers, body: JSON.stringify(body) });
      if (res.status === 401) {
        showToast('API Key 无效或缺失，请在顶部输入');
        throw new Error('401');
      }
      return res.json();
    }

    async function loadHealth() {
      try {
        const data = await apiGet('/v1/health');
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if (data.backend === 'seekdb') {
          dot.className = 'status-dot ok';
          text.textContent = 'SeekDB 在线';
        } else if (data.status === 'ok') {
          dot.className = 'status-dot warn';
          text.textContent = 'SQLite 降级模式';
        } else {
          dot.className = 'status-dot err';
          text.textContent = '服务异常';
        }
        if (data.wiki_pages != null) {
          document.getElementById('h-pages').textContent = data.wiki_pages;
          document.getElementById('h-judg').textContent = data.judgments;
        }
      } catch (e) {
        document.getElementById('status-dot').className = 'status-dot err';
        document.getElementById('status-text').textContent = '连接失败';
      }
    }

    async function loadHubStats() {
      try {
        const data = await apiGet('/wiki/v1/hub/stats');
        if (data.status !== 'ok') return;
        const s = data.global_stats || {};

        function setStat(id, val, zeroLabel) {
          const el = document.getElementById(id);
          if (val === 0 && zeroLabel) {
            el.textContent = zeroLabel;
            el.className = 'num zero';
          } else {
            el.textContent = val ?? '-';
            el.className = 'num';
          }
        }

        setStat('s-pages', s.total_pages);
        setStat('s-links', s.total_wikilinks);
        setStat('s-judg', s.total_judgments);
        setStat('s-robots', s.robots_covered);
        setStat('s-cgnodes', s.total_code_graph_nodes);
        setStat('s-cgedges', s.total_code_graph_edges);

        document.getElementById('h-pages').textContent = s.total_pages ?? '-';
        document.getElementById('h-links').textContent = s.total_wikilinks ?? '-';
        document.getElementById('h-judg').textContent = s.total_judgments ?? '-';
        document.getElementById('h-cgnodes').textContent = s.total_code_graph_nodes ?? '-';

        keywordsData = data.keywords || [];
        buildGraph(keywordsData);
      } catch (e) {
        document.getElementById('loading').textContent = '加载数据失败: ' + e.message;
      }
    }

    function buildGraph(keywords) {
      graph.clear();
      if (!keywords.length) {
        document.getElementById('loading').textContent = '暂无关键词数据';
        return;
      }

      const nodeMap = {};
      keywords.forEach((k, i) => {
        const id = 'kw_' + i;
        const size = Math.max(4, Math.min(20, (k.weight || 0.5) * 20));
        const color = TYPE_COLORS[k.type] || TYPE_COLORS.unknown;
        graph.addNode(id, {
          label: k.name,
          x: Math.random(),
          y: Math.random(),
          size: size,
          color: color,
          type: k.type,
          weight: k.weight,
          pages: k.pages,
        });
        nodeMap[id] = k;
      });

      // Build edges: connect keywords of same type to form clusters
      const ids = Object.keys(nodeMap);
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const a = graph.getNodeAttributes(ids[i]);
          const b = graph.getNodeAttributes(ids[j]);
          if (a.type === b.type && a.type !== 'unknown') {
            graph.addEdge(ids[i], ids[j], {
              size: 0.5,
              color: 'rgba(148, 163, 184, 0.15)',
            });
          }
        }
      }

      // Simple force-directed layout (no external dependency)
      function runLayout(g, iterations) {
        const nodes = g.nodes().map(id => ({ id, x: g.getNodeAttribute(id, 'x'), y: g.getNodeAttribute(id, 'y'), vx: 0, vy: 0 }));
        const nodeMap = {};
        nodes.forEach(n => nodeMap[n.id] = n);
        for (let iter = 0; iter < iterations; iter++) {
          // Repulsion
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i], b = nodes[j];
              let dx = a.x - b.x, dy = a.y - b.y;
              let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
              const f = 80 / (dist * dist);
              const fx = (dx / dist) * f, fy = (dy / dist) * f;
              a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
            }
          }
          // Attraction (edges)
          g.forEachEdge((edge, attrs, source, target) => {
            const s = nodeMap[source], t = nodeMap[target];
            if (!s || !t) return;
            let dx = t.x - s.x, dy = t.y - s.y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const f = dist * 0.008;
            const fx = (dx / dist) * f, fy = (dy / dist) * f;
            s.vx += fx; s.vy += fy; t.vx -= fx; t.vy -= fy;
          });
          // Apply + center gravity
          for (const n of nodes) {
            n.vx *= 0.6; n.vy *= 0.6;
            n.vx -= n.x * 0.003; n.vy -= n.y * 0.003;
            n.x += n.vx; n.y += n.vy;
          }
        }
        for (const n of nodes) g.setNodeAttribute(n.id, 'x', n.x);
        for (const n of nodes) g.setNodeAttribute(n.id, 'y', n.y);
      }
      runLayout(graph, 200);

      if (renderer) renderer.kill();
      renderer = new Sigma(graph, document.getElementById('sigma'), {
        renderEdgeLabels: false,
        labelSize: 12,
        labelColor: { color: '#e2e8f0' },
        hideEdgesOnMove: true,
      });

      renderer.on('enterNode', ({ node }) => showTooltip(node));
      renderer.on('leaveNode', () => hideTooltip());
      renderer.on('clickNode', ({ node }) => {
        const attrs = graph.getNodeAttributes(node);
        document.getElementById('search-input').value = attrs.label;
        doSearch();
      });

      document.getElementById('loading').style.display = 'none';
    }

    function showTooltip(nodeId) {
      const attrs = graph.getNodeAttributes(nodeId);
      const tooltip = document.getElementById('tooltip');
      tooltip.innerHTML = `
        <div class="title">${attrs.label}</div>
        <div class="type">${attrs.type || 'unknown'}</div>
        <div class="pages">涉及 ${attrs.pages || 0} 个页面 · 权重 ${(attrs.weight || 0).toFixed(2)}</div>
      `;
      tooltip.style.display = 'block';
    }

    function hideTooltip() {
      document.getElementById('tooltip').style.display = 'none';
    }

    function setFilter(type) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-btn[data-type="${type}"]`).classList.add('active');
      activeFilter = type;
      if (!renderer) return;
      graph.forEachNode((node, attrs) => {
        const hidden = activeFilter !== 'all' && attrs.type !== activeFilter;
        graph.setNodeAttribute(node, 'hidden', hidden);
      });
      renderer.refresh();
    }

    async function doSearch() {
      const q = document.getElementById('search-input').value.trim();
      const type = document.getElementById('search-type').value;
      if (!q) {
        document.getElementById('search-results').innerHTML = '';
        return;
      }
      try {
        const data = await apiPost('/v1/search', { query: q, search_type: type, top_k: 8 });
        const container = document.getElementById('search-results');
        container.innerHTML = '';
        if (data.status === 'ok' && data.results && data.results.length) {
          data.results.forEach(r => {
            const div = document.createElement('div');
            div.className = 'search-result';
            div.innerHTML = `
              <div class="title">${r.title}</div>
              <div class="snippet">${(r.snippet || '').substring(0, 180)}</div>
              <div class="score">score: ${(r.score || 0).toFixed(3)}</div>
            `;
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<div class="search-result"><div class="snippet">无结果</div></div>';
        }
      } catch (e) {
        console.error('Search failed', e);
      }
    }

    document.getElementById('sigma').addEventListener('mousemove', (e) => {
      const tooltip = document.getElementById('tooltip');
      if (tooltip.style.display === 'block') {
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
      }
    });

    // Init
    const savedKey = localStorage.getItem('rosclaw_api_key');
    if (savedKey) document.getElementById('api-key').placeholder = 'API Key 已保存 (点击保存可覆盖)';
    loadHealth();
    loadHubStats();
    setInterval(loadHealth, 30000);
  </script>
</body>
</html>
