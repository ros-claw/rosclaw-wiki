<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROSClaw Wiki — Knowledge Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      overflow: hidden;
      height: 100vh;
    }

    /* ── Top Bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 48px;
      background: #111827;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    #topbar .logo {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
    }
    #topbar .logo span { color: #94a3b8; font-weight: 400; font-size: 0.8rem; margin-left: 6px; }
    #topbar .search-wrap {
      flex: 1;
      max-width: 400px;
      display: flex;
      gap: 0;
    }
    #topbar .search-wrap input {
      flex: 1;
      padding: 6px 12px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.85rem;
    }
    #topbar .search-wrap button {
      padding: 6px 14px;
      border-radius: 0 6px 6px 0;
      border: 1px solid #334155;
      background: #1e40af;
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }
    #topbar .search-wrap button:hover { background: #2563eb; }
    #topbar .apikey-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #topbar .apikey-wrap input {
      width: 180px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.75rem;
      font-family: monospace;
    }
    #topbar .apikey-wrap button {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      background: #334155;
      color: #e2e8f0;
      font-size: 0.75rem;
      cursor: pointer;
    }
    #topbar .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    #topbar .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    #topbar .status-dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    #topbar .status-dot.warn { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
    #topbar .status-dot.err { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    /* ── Main Layout ── */
    #main {
      display: flex;
      flex: 1;
      height: calc(100vh - 48px);
      overflow: hidden;
    }

    /* ── Left Sidebar ── */
    #sidebar {
      width: 260px;
      background: #111827;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #sidebar .section {
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
    }
    #sidebar .section h3 {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-card .num {
      font-size: 1.2rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .stat-card .num.zero { color: #64748b; font-size: 0.85rem; }
    .stat-card .label {
      font-size: 0.65rem;
      color: #64748b;
      margin-top: 3px;
    }

    /* Type filters */
    .filter-list { display: flex; flex-direction: column; gap: 4px; }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #94a3b8;
      transition: background 0.15s;
    }
    .filter-item:hover { background: #1e293b; }
    .filter-item.active { background: #1e293b; color: #e2e8f0; }
    .filter-item .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .filter-item .count {
      margin-left: auto;
      font-size: 0.7rem;
      color: #64748b;
    }

    /* ── Graph Area ── */
    #graph-wrap {
      flex: 1;
      position: relative;
      background: #0a0e1a;
    }
    #sigma {
      width: 100%; height: 100%;
    }
    #graph-loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.9rem;
      color: #64748b;
      pointer-events: none;
    }
    #graph-hint {
      position: absolute;
      bottom: 12px; left: 12px;
      font-size: 0.7rem;
      color: #475569;
      pointer-events: none;
      background: rgba(10,14,26,0.8);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* ── Right Detail Panel ── */
    #detail-panel {
      width: 340px;
      background: #111827;
      border-left: 1px solid #1e293b;
      display: none;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    #detail-panel.open { display: flex; }
    #detail-header {
      padding: 16px;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      background: #111827;
      z-index: 10;
    }
    #detail-header .close-btn {
      float: right;
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }
    #detail-header .close-btn:hover { color: #e2e8f0; }
    #detail-header h2 {
      font-size: 1rem;
      color: #e2e8f0;
      margin-bottom: 8px;
      padding-right: 24px;
      word-break: break-word;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-entity { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-algorithm { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-concept { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-skill { background: rgba(236,72,153,0.15); color: #f472b6; }
    .badge-unknown { background: rgba(100,116,139,0.15); color: #94a3b8; }

    #detail-body { padding: 16px; }
    #detail-body .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
    }
    #detail-body .meta-row .key { color: #64748b; }
    #detail-body .meta-row .val { color: #e2e8f0; font-weight: 500; }
    #detail-body .section-title {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 16px 0 8px;
    }
    .link-list { display: flex; flex-direction: column; gap: 4px; }
    .link-item {
      padding: 6px 10px;
      border-radius: 6px;
      background: #1e293b;
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
      transition: background 0.15s;
    }
    .link-item:hover { background: #334155; color: #e2e8f0; }
    .link-item .arrow { color: #475569; margin-right: 4px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.85rem;
      display: none;
      z-index: 1000;
      border: 1px solid #334155;
    }
    #toast.info { border-color: #38bdf8; }
    #toast.err { border-color: #ef4444; }

    /* ── Page View ── */
    #page-view {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #0a0e1a;
      padding: 32px 48px;
      max-width: 900px;
      margin: 0 auto;
    }
    #page-view.active { display: block; }
    #page-view .page-breadcrumb {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 16px;
    }
    #page-view .page-breadcrumb a {
      color: #38bdf8;
      text-decoration: none;
      cursor: pointer;
    }
    #page-view .page-breadcrumb a:hover { text-decoration: underline; }
    #page-view .page-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    #page-view .page-meta .meta-tag {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    #page-view .page-meta .meta-tag.confidence-high { color: #4ade80; border-color: rgba(74,222,128,0.3); }
    #page-view .page-meta .meta-tag.confidence-mid { color: #fbbf24; border-color: rgba(251,191,36,0.3); }
    #page-view .page-meta .meta-tag.confidence-low { color: #f87171; border-color: rgba(248,113,113,0.3); }
    #page-view h1 {
      font-size: 1.8rem;
      color: #e2e8f0;
      margin-bottom: 8px;
      font-weight: 700;
    }
    #page-view h2 {
      font-size: 1.2rem;
      color: #e2e8f0;
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    #page-view h3 {
      font-size: 1rem;
      color: #cbd5e1;
      margin: 20px 0 10px;
    }
    #page-view p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    #page-view ul, #page-view ol {
      margin: 12px 0 12px 20px;
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    #page-view li { margin-bottom: 6px; }
    #page-view a {
      color: #38bdf8;
      text-decoration: none;
    }
    #page-view a:hover { text-decoration: underline; }
    #page-view strong { color: #e2e8f0; }
    #page-view code {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.85rem;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #f472b6;
    }
    #page-view blockquote {
      border-left: 3px solid #38bdf8;
      margin: 16px 0;
      padding: 8px 16px;
      background: rgba(56,189,248,0.05);
      color: #94a3b8;
    }
    #page-view .page-not-found {
      text-align: center;
      padding: 80px 20px;
    }
    #page-view .page-not-found h2 {
      font-size: 1.5rem;
      color: #e2e8f0;
      border: none;
    }
    #page-view .page-not-found p { color: #64748b; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="logo">ROSClaw<span>Wiki Graph</span></div>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="搜索 Wiki 页面..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">搜索</button>
    </div>
    <div class="status">
      <div id="status-dot" class="status-dot err"></div>
      <span id="status-text">连接中...</span>
    </div>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="section">
        <h3>知识库统计</h3>
        <div class="stat-grid">
          <div class="stat-card"><div class="num" id="s-pages">-</div><div class="label">📄 Wiki 页面</div></div>
          <div class="stat-card"><div class="num" id="s-links">-</div><div class="label">🔗 交叉链接</div></div>
          <div class="stat-card"><div class="num" id="s-judg">-</div><div class="label">⚖️ 物理判据</div></div>
          <div class="stat-card"><div class="num" id="s-robots">-</div><div class="label">🤖 机器人覆盖</div></div>
        </div>
        <h4 style="margin: 12px 0 6px; font-size: 0.85rem; color: #475569;">Wiki 概念图 (Obsidian 视图)</h4>
        <div class="stat-grid">
          <div class="stat-card"><div class="num" id="s-wnodes">-</div><div class="label">概念节点</div></div>
          <div class="stat-card"><div class="num" id="s-wedges">-</div><div class="label">概念边</div></div>
        </div>
        <h4 style="margin: 12px 0 6px; font-size: 0.85rem; color: #475569;">代码图 (Python AST)</h4>
        <div class="stat-grid">
          <div class="stat-card"><div class="num" id="s-cnodes">-</div><div class="label">代码节点</div></div>
          <div class="stat-card"><div class="num" id="s-cedges">-</div><div class="label">代码边</div></div>
        </div>
        <p style="margin: 8px 0 0; font-size: 0.72rem; color: #64748b; line-height: 1.5;">
          概念图 = 页面 + <code>[[wikilink]]</code>；代码图 = 摄入的研究仓库的 Python 模块/调用关系。两者衡量不同层次。
        </p>
      </div>
      <div class="section">
        <h3>节点类型过滤</h3>
        <div class="filter-list" id="filter-list">
          <div class="filter-item active" data-type="all" onclick="setFilter('all')">
            <span class="dot" style="background:#e2e8f0"></span>全部<span class="count" id="c-all">-</span>
          </div>
        </div>
      </div>
    </div>

    <div id="graph-wrap">
      <div id="graph-loading">加载知识图谱...</div>
      <div id="sigma"></div>
      <div id="graph-hint">滚轮缩放 · 拖拽节点 · 点击查看详情</div>
    </div>

    <div id="page-view">
      <div class="page-breadcrumb"><a onclick="showGraph()">← 知识图谱</a></div>
      <div id="page-content"></div>
    </div>

    <div id="detail-panel">
      <div id="detail-header">
        <button class="close-btn" onclick="closeDetail()">&times;</button>
        <h2 id="d-title">-</h2>
        <span class="badge" id="d-badge">-</span>
      </div>
      <div id="detail-body">
        <div class="meta-row"><span class="key">链接数</span><span class="val" id="d-links">-</span></div>
        <div class="meta-row"><span class="key">置信度</span><span class="val" id="d-confidence">-</span></div>
        <div class="section-title">出链</div>
        <div class="link-list" id="d-outgoing"></div>
        <div class="section-title">入链</div>
        <div class="link-list" id="d-incoming"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API_BASE = 'https://api.rosclaw.io';
    const TYPE_COLORS = {
      entity: '#3b82f6',
      algorithm: '#22c55e',
      concept: '#f59e0b',
      skill: '#ec4899',
      unknown: '#94a3b8',
    };
    const BADGE_CLASS = {
      entity: 'badge-entity',
      algorithm: 'badge-algorithm',
      concept: 'badge-concept',
      skill: 'badge-skill',
      unknown: 'badge-unknown',
    };

    let graph = new graphology.Graph({ multi: false, allowSelfLoops: false });
    let renderer = null;
    let camera = null;
    let activeFilter = 'all';
    let graphData = { nodes: [], edges: [] };
    let typeCounts = {};
    let hoveredNode = null;
    let selectedNode = null;

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = type; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function apiGet(path) {
      const res = await fetch(API_BASE + path);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }
    async function apiPost(path, body) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    // ── Health ──
    async function loadHealth() {
      try {
        const data = await apiGet('/v1/health');
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if (data.backend === 'seekdb') {
          dot.className = 'status-dot ok'; text.textContent = 'SeekDB 在线';
        } else if (data.status === 'ok') {
          dot.className = 'status-dot warn'; text.textContent = 'SQLite 降级';
        } else {
          dot.className = 'status-dot err'; text.textContent = '服务异常';
        }
      } catch (e) {
        document.getElementById('status-dot').className = 'status-dot err';
        document.getElementById('status-text').textContent = '连接失败';
      }
    }

    // ── Load Graph ──
    async function loadGraph() {
      try {
        const data = await apiGet('/wiki/v1/graph');
        if (data.status !== 'ok') return;
        graphData = data;
        buildGraph(data.nodes, data.edges);
        updateStats(data.nodes.length, data.edges.length);
        buildFilters(data.nodes);
        document.getElementById('graph-loading').style.display = 'none';
      } catch (e) {
        document.getElementById('graph-loading').textContent = '加载失败: ' + e.message;
      }
    }

    function buildGraph(nodes, edges) {
      graph.clear();
      if (!nodes.length) return;

      // Add nodes
      nodes.forEach(n => {
        const size = Math.max(3, Math.min(16, 3 + (n.link_count || 0) * 0.7));
        const color = TYPE_COLORS[n.type] || TYPE_COLORS.unknown;
        graph.addNode(n.id, {
          label: n.title || n.id,
          x: Math.random() * 100 - 50,
          y: Math.random() * 100 - 50,
          size: size,
          color: color,
          _type: n.type,
          _title: n.title,
          _confidence: n.confidence,
          _linkCount: n.link_count || 0,
        });
      });

      // Add edges
      edges.forEach(e => {
        if (graph.hasNode(e.source) && graph.hasNode(e.target)) {
          try {
            graph.addEdge(e.source, e.target, {
              size: 0.5,
              color: 'rgba(148,163,184,0.12)',
            });
          } catch (err) { /* duplicate edge */ }
        }
      });

      // Layout
      runLayout(graph, 250);

      // Render
      if (renderer) renderer.kill();
      renderer = new Sigma(graph, document.getElementById('sigma'), {
        renderEdgeLabels: false,
        labelSize: 13,
        labelColor: { color: '#f8fafc' },
        labelWeight: 'bold',
        hideEdgesOnMove: true,
        defaultNodeType: 'circle',
        nodeReducer: (node, attrs) => {
          // Selected node: gold border + larger size + bigger label, keep original fill color
          if (selectedNode && selectedNode === node) {
            return {
              ...attrs,
              size: Math.min(attrs.size * 2.2, 28),
              zIndex: 10,
              labelSize: 16,
              labelColor: { color: '#ffffff' },
              borderColor: '#fbbf24',
              borderSize: 3,
            };
          }
          // Hovered node (not selected): cyan border + slight size bump
          if (hoveredNode && hoveredNode === node && !selectedNode) {
            return {
              ...attrs,
              size: Math.min(attrs.size * 1.4, 22),
              zIndex: 8,
              labelSize: 14,
              borderColor: '#22d3ee',
              borderSize: 2,
            };
          }
          // Dim non-connected nodes when hovering or selected
          const focusNode = selectedNode || hoveredNode;
          if (focusNode && focusNode !== node) {
            const isNeighbor = graph.neighbors(focusNode).includes(node);
            if (!isNeighbor) {
              return { ...attrs, color: 'rgba(30,41,59,0.35)', label: '', zIndex: 0 };
            }
            // Neighbor highlight: blue border, keep original fill, bigger label
            return {
              ...attrs,
              size: Math.min(attrs.size * 1.3, 20),
              zIndex: 5,
              labelSize: 14,
              borderColor: '#60a5fa',
              borderSize: 2,
            };
          }
          // Filter by type
          if (activeFilter !== 'all' && attrs._type !== activeFilter) {
            return { ...attrs, hidden: true };
          }
          return attrs;
        },
        edgeReducer: (edge, attrs) => {
          const focusNode = selectedNode || hoveredNode;
          if (focusNode) {
            const [src, tgt] = graph.extremities(edge);
            const isConnected = src === focusNode || tgt === focusNode;
            if (!isConnected) {
              return { ...attrs, color: 'rgba(30,41,59,0.15)', hidden: false };
            }
            return { ...attrs, color: 'rgba(96,165,250,0.6)', size: 1.5, zIndex: 5 };
          }
          return attrs;
        },
      });

      camera = renderer.getCamera();

      // Events
      renderer.on('enterNode', ({ node }) => {
        hoveredNode = node;
        renderer.refresh();
      });
      renderer.on('leaveNode', () => {
        hoveredNode = null;
        renderer.refresh();
      });
      renderer.on('clickNode', ({ node }) => {
        selectedNode = node;
        renderer.refresh();
        showDetail(node);
      });
      renderer.on('clickStage', () => {
        selectedNode = null;
        renderer.refresh();
      });
    }

    // Simple force-directed layout
    function runLayout(g, iterations) {
      const nodes = g.nodes().map(id => ({ id, x: g.getNodeAttribute(id, 'x'), y: g.getNodeAttribute(id, 'y'), vx: 0, vy: 0 }));
      const nodeMap = {}; nodes.forEach(n => nodeMap[n.id] = n);
      for (let iter = 0; iter < iterations; iter++) {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            let dx = a.x - b.x, dy = a.y - b.y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const f = 60 / (dist * dist);
            const fx = (dx / dist) * f, fy = (dy / dist) * f;
            a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
          }
        }
        g.forEachEdge((edge, attrs, source, target) => {
          const s = nodeMap[source], t = nodeMap[target];
          if (!s || !t) return;
          let dx = t.x - s.x, dy = t.y - s.y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const f = dist * 0.006;
          const fx = (dx / dist) * f, fy = (dy / dist) * f;
          s.vx += fx; s.vy += fy; t.vx -= fx; t.vy -= fy;
        });
        for (const n of nodes) {
          n.vx *= 0.6; n.vy *= 0.6;
          n.vx -= n.x * 0.002; n.vy -= n.y * 0.002;
          n.x += n.vx; n.y += n.vy;
        }
      }
      for (const n of nodes) { g.setNodeAttribute(n.id, 'x', n.x); g.setNodeAttribute(n.id, 'y', n.y); }
    }

    // ── Stats ──
    function fmt(n) {
      if (typeof n !== 'number') return '-';
      return n.toLocaleString();
    }
    async function updateStats(nodeCount, edgeCount) {
      try {
        const data = await apiGet('/wiki/v1/hub/stats');
        const s = data.global_stats || {};
        document.getElementById('s-pages').textContent = fmt(s.total_pages);
        document.getElementById('s-links').textContent = fmt(s.total_wikilinks);
        document.getElementById('s-judg').textContent = fmt(s.total_judgments);
        document.getElementById('s-robots').textContent = fmt(s.robots_covered);
        // Wiki concept graph (current page): prefer rendered counts when available
        const wn = (typeof nodeCount === 'number' && nodeCount > 0)
          ? nodeCount : (s.wiki_graph_nodes ?? s.total_pages);
        const we = (typeof edgeCount === 'number' && edgeCount > 0)
          ? edgeCount : s.wiki_graph_edges;
        document.getElementById('s-wnodes').textContent = fmt(wn);
        document.getElementById('s-wedges').textContent = fmt(we);
        // Underlying code graph (Python AST)
        document.getElementById('s-cnodes').textContent = fmt(s.total_code_graph_nodes);
        document.getElementById('s-cedges').textContent = fmt(s.total_code_graph_edges);
      } catch (e) {}
    }

    // ── Filters ──
    function buildFilters(nodes) {
      typeCounts = {};
      nodes.forEach(n => { typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });
      const list = document.getElementById('filter-list');
      list.innerHTML = `
        <div class="filter-item active" data-type="all" onclick="setFilter('all')">
          <span class="dot" style="background:#e2e8f0"></span>全部<span class="count" id="c-all">${nodes.length}</span>
        </div>`;
      Object.entries(typeCounts).forEach(([type, count]) => {
        const color = TYPE_COLORS[type] || TYPE_COLORS.unknown;
        list.innerHTML += `
          <div class="filter-item" data-type="${type}" onclick="setFilter('${type}')">
            <span class="dot" style="background:${color}"></span>${type}<span class="count">${count}</span>
          </div>`;
      });
    }
    function setFilter(type) {
      document.querySelectorAll('.filter-item').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-item[data-type="${type}"]`)?.classList.add('active');
      activeFilter = type;
      if (renderer) renderer.refresh();
    }

    // ── Detail Panel ──
    function showDetail(nodeId) {
      const attrs = graph.getNodeAttributes(nodeId);
      const node = graphData.nodes.find(n => n.id === nodeId);
      if (!node) return;

      document.getElementById('d-title').textContent = attrs._title || nodeId;
      const badge = document.getElementById('d-badge');
      badge.textContent = attrs._type || 'unknown';
      badge.className = 'badge ' + (BADGE_CLASS[attrs._type] || BADGE_CLASS.unknown);

      document.getElementById('d-links').textContent = attrs._linkCount;
      document.getElementById('d-confidence').textContent = (attrs._confidence || 0).toFixed(2);

      // Outgoing links
      const outgoing = graphData.edges.filter(e => e.source === nodeId).map(e => e.target);
      const outEl = document.getElementById('d-outgoing');
      outEl.innerHTML = outgoing.length
        ? outgoing.map(tid => {
            const t = graphData.nodes.find(n => n.id === tid);
            return `<div class="link-item" onclick="focusNode('${tid}')"><span class="arrow">→</span>${t ? t.title : tid}</div>`;
          }).join('')
        : '<div class="link-item" style="opacity:0.5">无出链</div>';

      // Incoming links
      const incoming = graphData.edges.filter(e => e.target === nodeId).map(e => e.source);
      const inEl = document.getElementById('d-incoming');
      inEl.innerHTML = incoming.length
        ? incoming.map(sid => {
            const s = graphData.nodes.find(n => n.id === sid);
            return `<div class="link-item" onclick="focusNode('${sid}')"><span class="arrow">←</span>${s ? s.title : sid}</div>`;
          }).join('')
        : '<div class="link-item" style="opacity:0.5">无入链</div>';

      document.getElementById('detail-panel').classList.add('open');
    }
    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('open');
    }
    function focusNode(nodeId) {
      if (!graph.hasNode(nodeId) || !camera) return;
      const attrs = graph.getNodeAttributes(nodeId);
      camera.animate({ x: attrs.x, y: attrs.y, ratio: 0.3 }, { duration: 400 });
      showDetail(nodeId);
    }

    // ── Search ──
    async function doSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      // 1. Call local Flask backend (no API key needed)
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&type=hybrid&limit=5`);
        const data = await res.json();
        if (data.status === 'done' && data.matches && data.matches.length) {
          // Show results in a simple dropdown
          _showSearchResults(data.matches, q);
          return;
        }
      } catch (e) {
        console.error('Search error:', e);
      }

      // 2. Fallback: search in graph nodes
      const qLower = q.toLowerCase();
      const matches = graphData.nodes.filter(n =>
        (n.title || '').toLowerCase().includes(qLower) ||
        (n.id || '').toLowerCase().includes(qLower)
      );
      if (matches.length) {
        showGraph();
        focusNode(matches[0].id);
        showToast(`已定位: ${matches[0].title || matches[0].id}`, 'info');
      } else {
        showToast('未找到匹配的页面', 'err');
      }
    }

    function _showSearchResults(matches, query) {
      let panel = document.getElementById('search-results');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'search-results';
        panel.style.cssText = 'position:absolute;top:60px;left:20px;right:20px;max-width:600px;margin:0 auto;background:#0f172a;border:1px solid #334155;border-radius:12px;z-index:100;max-height:400px;overflow-y:auto;padding:8px 0;';
        document.body.appendChild(panel);
      }
      panel.innerHTML = matches.map(m => {
        const pageId = m.file_path;
        const title = m.title || pageId;
        const snippet = (m.snippet || '').substring(0, 120).replace(/[#*`]/g, '');
        return `<div style="padding:10px 16px;cursor:pointer;border-bottom:1px solid #1e293b;" onclick="_clickSearchResult('${pageId}')" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='transparent'">
          <div style="font-weight:600;color:#e2e8f0;font-size:14px;">${title}</div>
          <div style="color:#94a3b8;font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${snippet}</div>
        </div>`;
      }).join('');
      panel.style.display = 'block';
      // Click outside to close
      setTimeout(() => {
        document.addEventListener('click', function closeSearch(e) {
          if (!panel.contains(e.target) && e.target.id !== 'search-input') {
            panel.style.display = 'none';
            document.removeEventListener('click', closeSearch);
          }
        });
      }, 100);
    }

    function _clickSearchResult(pageId) {
      const panel = document.getElementById('search-results');
      if (panel) panel.style.display = 'none';
      if (graph.hasNode(pageId)) {
        showGraph();
        focusNode(pageId);
      } else {
        showPage(pageId);
      }
    }

    // ── Client-side routing & page view ──
    function getPageIdFromPath() {
      const path = window.location.pathname.replace(/^\//, '').replace(/\.html?$/, '');
      return path && path !== 'index' ? path : null;
    }

    function showGraph(pushState=true) {
      document.getElementById('graph-wrap').style.display = 'block';
      document.getElementById('page-view').classList.remove('active');
      document.getElementById('detail-panel').classList.remove('open');
      document.title = 'ROSClaw Wiki — Knowledge Graph';
      if (pushState && window.location.pathname !== '/') {
        history.pushState({view: 'graph'}, '', '/');
      }
    }

    function pageIdToSlug(title) {
      return title.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    }

    function parseWikilinks(html) {
      return html.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, target, label) => {
        const slug = pageIdToSlug(target);
        const display = label || target;
        return `<a href="/${slug}" onclick="event.preventDefault(); showPage('${slug}');">${display}</a>`;
      });
    }

    function renderMarkdown(body) {
      if (!body) return '';
      let html = marked.parse(body);
      html = parseWikilinks(html);
      return html;
    }

    async function showPage(pageId, pushState=true) {
      if (!pageId) { showGraph(); return; }

      document.getElementById('graph-wrap').style.display = 'none';
      document.getElementById('page-view').classList.add('active');
      document.getElementById('detail-panel').classList.remove('open');

      const contentEl = document.getElementById('page-content');
      contentEl.innerHTML = '<p style="color:#64748b">加载中...</p>';

      try {
        const res = await fetch(`/api/page/${pageId}`);
        const data = await res.json();

        if (data.status !== 'done') {
          contentEl.innerHTML = `
            <div class="page-not-found">
              <h2>页面未找到</h2>
              <p>未找到 ID 为 "${pageId}" 的 Wiki 页面</p>
            </div>`;
          document.title = '页面未找到 — ROSClaw Wiki';
          return;
        }

        const meta = data.meta || {};
        const body = data.body || '';
        const title = meta.title || pageId;

        const confidence = parseFloat(meta.confidence || 0);
        let confClass = 'confidence-low';
        if (confidence >= 0.8) confClass = 'confidence-high';
        else if (confidence >= 0.5) confClass = 'confidence-mid';

        const metaTags = [];
        metaTags.push(`<span class="meta-tag ${confClass}">置信度: ${confidence.toFixed(2)}</span>`);
        if (meta.type) metaTags.push(`<span class="meta-tag">类型: ${meta.type}</span>`);
        if (meta.created_at) metaTags.push(`<span class="meta-tag">创建于: ${meta.created_at}</span>`);
        if (meta.sources && meta.sources.length) {
          metaTags.push(`<span class="meta-tag">来源: ${meta.sources.length} 个</span>`);
        }
        if (meta.tags && meta.tags.length) {
          meta.tags.forEach(t => metaTags.push(`<span class="meta-tag">#${t}</span>`));
        }

        contentEl.innerHTML = `
          <div class="page-meta">${metaTags.join('')}</div>
          ${renderMarkdown(body)}
        `;
        document.title = `${title} — ROSClaw Wiki`;

        if (pushState) {
          history.pushState({view: 'page', id: pageId}, '', `/${pageId}`);
        }
      } catch (e) {
        contentEl.innerHTML = `<p style="color:#ef4444">加载失败: ${e.message}</p>`;
      }
    }

    // Override graph node click → navigate to page view
    const originalShowDetail = showDetail;
    showDetail = function(nodeId) {
      showPage(nodeId);
    };

    // Browser back/forward
    window.addEventListener('popstate', (e) => {
      const pageId = getPageIdFromPath();
      if (pageId) {
        showPage(pageId, false);
      } else {
        showGraph(false);
      }
    });

    // Init
    loadHealth();
    loadGraph();
    setInterval(loadHealth, 30000);

    // Route on initial load
    const initialPageId = getPageIdFromPath();
    if (initialPageId) {
      setTimeout(() => showPage(initialPageId, false), 100);
    }
  </script>
</body>
