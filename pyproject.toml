[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosclaw-wiki"
version = "1.0.0"
description = "The Causal Nexus for Embodied AI — A physical commonsense firewall and Knowledge-as-a-Service platform."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ROSClaw.io", email = "admin@rosclaw.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Whoosh>=2.7",
    "sentence-transformers>=2.5",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
    "networkx>=3.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "html2text>=2024.2",
    "arxiv>=2.0",
    "pymupdf>=1.23",
    "Pillow>=10.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
rosclaw-wiki = "rosclaw_wiki.cli:main"

[project.urls]
Homepage = "https://rosclaw.io"
Repository = "https://github.com/ros-claw/rosclaw-wiki"
Documentation = "https://rosclaw.io/docs"
Issues = "https://github.com/ros-claw/rosclaw-wiki/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosclaw_wiki*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
